name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ImProd.sln

      - name: Build
        run: dotnet build ImProd.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ImProd.sln --configuration Release --no-build
